name: PR build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PLUGIN_ID: albus-imagine

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version:"20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p build-artifacts
          cp main.js manifest.json styles.css build-artifacts/
          cd build-artifacts
          zip -r "${PLUGIN_ID}-pr-${GITHUB_SHA::7}.zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-pr-${{ github.event.pull_request.number }}
          path: build-artifacts/
          retention-days: 7
